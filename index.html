<style>
  :root{ --ink:#1C1B19; --muted:#6B665E; --green:#15735A; }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  nav{display:flex;align-items:center;gap:10px;padding:26px 0;font-size:14px}
  nav .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  nav .name{font-family:"Instrument Serif",Georgia,serif;font-weight:400;
    font-size:25px;letter-spacing:-.005em;line-height:1}
  nav a{margin-left:auto;color:var(--muted);text-decoration:none;font-size:14px}
  nav a:hover{color:var(--ink)}
  .band{position:relative;width:100%;height:clamp(340px,50vh,540px)}
  canvas{display:block;width:100%;height:100%}
  .copy{padding:40px 0 64px;max-width:680px}
  footer{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:baseline;
    border-top:1px solid rgba(28,27,25,.10);padding:22px 0 44px;
    font-size:13px;color:var(--muted)}
  footer a{color:var(--muted);text-decoration:none;margin-left:auto}
  footer a:hover{color:var(--ink)}
  h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;
    font-size:clamp(34px,5.2vw,58px);line-height:1.06;letter-spacing:-.012em;margin:0 0 22px}
  h1 em{font-style:italic;color:var(--green)}
  p{margin:0;color:var(--muted);font-size:17px;line-height:1.65;max-width:560px}

<body>
<div class="wrap">
  <nav><span class="dot"></span><span class="name">cimpla</span><a href="mailto:kontakt@custom46.com">Kontakt</a></nav>
  <div class="band"><canvas id="hero"></canvas></div>
  <div class="copy">
    <h1>Förenkla <em>informationsflödet</em>.</h1>
    <p>Lägger ni tid på att strukturera produktdata och söka igenom leverantörsinfo? Sluta med det.</p>

    <span>Del av custom46 AB</span>
    <a href="mailto:kontakt@custom46.com">kontakt@custom46.com</a>

</div>


<script>
(function(){
  var cv=document.getElementById('hero'), ctx=cv.getContext('2d');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- installningar ----------
  var DOC_SET=[0,1,2,3,4];   // vilka dokumenttyper som roterar i vanstra flodet
  var CYCLE=5.6;             // sekunder per dokument i en slot
  var SLOTS=3;               // antal dokumentplatser i vanstra flodet
  var SCROLL=19;             // e-handelsvyns scrollfart, designenheter per sekund
  var DESIGN=430;            // e-handelsvyns designbredd i enheter

  // ---------- smaverktyg ----------
  var SANS='"IBM Plex Sans",system-ui,sans-serif';
  var MONO='"IBM Plex Mono",ui-monospace,Menlo,monospace';
  function lerp(a,b,t){return a+(b-a)*t;}
  function clamp01(t){return t<0?0:t>1?1:t;}
  function easeOut(t){return 1-Math.pow(1-t,3);}
  function hash(n,s){var x=Math.sin(n*127.1+s*311.7)*43758.5453;return x-Math.floor(x);}
  function g(a){return 'rgba(21,115,90,'+a+')';}
  function ink(a){return 'rgba(28,27,25,'+a+')';}
  function rr(c,x,y,w,h,r){
    r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
    c.beginPath(); c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
  }
  function bar(c,x,y,w,h,col){ rr(c,x,y,w,h,Math.min(h/2,2.5)); c.fillStyle=col; c.fill(); }
  function T(c,s,x,y,size,weight,col,align,face){
    c.font=(weight?weight+' ':'')+size.toFixed(2)+'px '+(face||SANS);
    c.textAlign=align||'left'; c.textBaseline='alphabetic';
    c.fillStyle=col; c.fillText(s,x,y);
  }
  // punkt pa en kubisk bezier
  function bez(p,x0,y0,x1,y1,x2,y2,x3,y3){
    var m=1-p, a=m*m*m, b=3*m*m*p, c=3*m*p*p, d=p*p*p;
    return {x:a*x0+b*x1+c*x2+d*x3, y:a*y0+b*y1+c*y2+d*y3};
  }

  var W,H,DPR,narrow,docCX,docH,box,br,scale,chU,cols;

  // ---------- dokumenttyper (vanstra flodet) ----------
  // Abstrakta ark, ingen lasbar text. Badgen ar det enda som namnger formatet.
  var DOCS=[
    {t:0,lw:210,lh:272,fit:1.00,tint:'#FFFFFF',skew:0    },  // pdf
    {t:1,lw:264,lh:186,fit:0.74,tint:'#FFFFFF',skew:0    },  // kalkylblad
    {t:2,lw:210,lh:272,fit:1.00,tint:'#FFFFFF',skew:0    },  // textdokument
    {t:3,lw:206,lh:266,fit:0.98,tint:'#FCFBF5',skew:0.028},  // skannat ark
    {t:4,lw:172,lh:296,fit:1.00,tint:'#F7F6F4',skew:0    }   // chatt
  ];
  // var pa arket varden plockas ut (andel av hojden)
  var ANCHORS=[0.34,0.52,0.70];

  function badge(c,x,y,txt,r,gr,b){
    rr(c,x,y,32,14,3); c.fillStyle='rgba('+r+','+gr+','+b+',.12)'; c.fill();
    T(c,txt,x+16,y+10,7.2,'700','rgba('+r+','+gr+','+b+',.85)','center');
  }

  function drawPdf(c,d){
    var lw=d.lw;
    badge(c,14,14,'PDF',176,62,52);
    bar(c,14,40,lw*0.58,9,ink(.22));
    bar(c,14,55,lw*0.34,6,ink(.13));
    for(var i=0;i<5;i++) bar(c,14,78+i*10,(lw-28)*(0.66+0.30*hash(i,1)),4.2,ink(.10));
    c.strokeStyle=ink(.12); c.lineWidth=0.7;
    c.beginPath(); c.moveTo(14,138); c.lineTo(lw-14,138); c.stroke();
    for(var r=0;r<5;r++){
      var y=148+r*13;
      bar(c,14,y,30,5,ink(.16));
      bar(c,54,y,lw*0.36,5,ink(.10));
      bar(c,lw-52,y,38,5,ink(.13));
    }
    bar(c,lw-86,224,72,7,ink(.18));
  }

  function drawSheet(c,d){
    var lw=d.lw, lh=d.lh, gut=14, top=26, rowH=16;
    badge(c,lw-46,8,'XLS',24,110,70);
    c.fillStyle='#F4F3F0'; c.fillRect(0,top-12,lw,12); c.fillRect(0,top-12,gut,lh);
    var colX=[gut,gut+56,gut+118,gut+172,lw];
    c.fillStyle=g('.07'); c.fillRect(gut,top,lw-gut,rowH);
    c.strokeStyle=ink(.10); c.lineWidth=0.5;
    for(var v=0;v<colX.length;v++){ c.beginPath(); c.moveTo(colX[v]+0.25,top-12); c.lineTo(colX[v]+0.25,lh); c.stroke(); }
    var rows=Math.ceil((lh-top)/rowH);
    for(var r=0;r<=rows;r++){
      var y=top+r*rowH;
      c.beginPath(); c.moveTo(0,y+0.25); c.lineTo(lw,y+0.25); c.stroke();
    }
    for(var h=0;h<4;h++) bar(c,colX[h]+5,top+5.5,Math.min(34,colX[h+1]-colX[h]-12),5,g('.45'));
    for(var s=0;s<rows-1;s++){
      var yy=top+(s+1)*rowH+5.5;
      if(yy>lh-8) break;
      bar(c,colX[0]+5,yy,40,5,ink(.20));
      bar(c,colX[1]+5,yy,(colX[2]-colX[1]-14)*(0.62+0.34*hash(s,2)),5,ink(.13));
      bar(c,colX[3]-22,yy,16,5,ink(.18));
      bar(c,colX[4]-46,yy,34,5,ink(.12));
    }
  }

  function drawWord(c,d){
    var lw=d.lw;
    badge(c,14,14,'DOC',52,92,150);
    bar(c,(lw-118)/2,44,118,9,ink(.22));
    bar(c,(lw-70)/2,58,70,5,ink(.11));
    for(var p=0;p<3;p++){
      var y0=82+p*54;
      for(var i=0;i<4;i++){
        var w=(lw-28)*(i===3?0.44+0.2*hash(p*4+i,5):0.88+0.1*hash(p*4+i,4));
        bar(c,14,y0+i*10,w,4.2,ink(.11));
      }
    }
    bar(c,14,244,lw*0.30,5,ink(.14));
  }

  function drawScan(c,d){
    var lw=d.lw, lh=d.lh;
    c.strokeStyle='rgba(90,120,140,.18)'; c.lineWidth=0.6;
    for(var y=44;y<lh-16;y+=19){ c.beginPath(); c.moveTo(14,y+0.3); c.lineTo(lw-14,y+0.3); c.stroke(); }
    c.strokeStyle='rgba(190,90,80,.20)';
    c.beginPath(); c.moveTo(26,0); c.lineTo(26,lh); c.stroke();
    // handskrivna slingor
    c.strokeStyle='rgba(30,45,70,.52)'; c.lineWidth=1.5; c.lineCap='round';
    for(var l=0;l<6;l++){
      var yy=40+l*19, x=32, end=x+(lw-66)*(0.42+0.52*hash(l,7));
      c.beginPath(); c.moveTo(x,yy-4);
      for(var s=0;x+s<end;s+=9){
        var up=(s/9)%2?-6:-1;
        c.quadraticCurveTo(x+s+4.5,yy-4+up,x+s+9,yy-4+(hash(l*9+s,8)-0.5)*3);
      }
      c.stroke();
    }
    c.lineWidth=1; c.lineCap='butt';
    // vikt horn
    c.fillStyle='rgba(40,34,24,.08)';
    c.beginPath(); c.moveTo(lw-26,lh); c.lineTo(lw,lh-26); c.lineTo(lw,lh); c.closePath(); c.fill();
    // fotoljus
    var pg=c.createLinearGradient(0,0,lw,lh);
    pg.addColorStop(0,'rgba(255,255,255,.30)');
    pg.addColorStop(0.55,'rgba(255,255,255,0)');
    pg.addColorStop(1,'rgba(40,34,24,.10)');
    c.fillStyle=pg; c.fillRect(0,0,lw,lh);
  }

  function drawChat(c,d){
    var lw=d.lw, lh=d.lh;
    c.fillStyle='#FFFFFF'; c.fillRect(0,0,lw,44);
    c.strokeStyle=ink(.10); c.lineWidth=0.6;
    c.beginPath(); c.moveTo(0,44.3); c.lineTo(lw,44.3); c.stroke();
    c.beginPath(); c.arc(22,28,9,0,6.2832); c.fillStyle='#E3E1DC'; c.fill();
    bar(c,38,22,64,7,ink(.20)); bar(c,38,33,40,5,ink(.10));
    function bub(x,y,w,h,mine){
      rr(c,x,y,w,h,8); c.fillStyle=mine?'rgba(21,115,90,.14)':'#FFFFFF'; c.fill();
      if(!mine){ c.strokeStyle=ink(.09); c.lineWidth=0.7; c.stroke(); }
      var n=Math.max(1,Math.floor(h/12));
      for(var i=0;i<n;i++)
        bar(c,x+9,y+9+i*11,(w-22)*(0.55+0.4*hash(x+i,9)),4.2,mine?g('.42'):ink(.14));
    }
    bub(12,56,116,34,false);
    bub(12,98,124,48,false);
    bub(lw-104,154,92,24,true);
    bub(12,186,120,34,false);
    bub(lw-118,228,106,24,true);
    c.fillStyle='#FFFFFF'; c.fillRect(0,lh-32,lw,32);
    c.strokeStyle=ink(.10);
    c.beginPath(); c.moveTo(0,lh-31.7); c.lineTo(lw,lh-31.7); c.stroke();
    rr(c,12,lh-24,lw-48,17,8.5); c.fillStyle='#F2F1EE'; c.fill();
    c.beginPath(); c.arc(lw-20,lh-15.5,8.5,0,6.2832); c.fillStyle=g('.80'); c.fill();
  }

  var PAINT=[drawPdf,drawSheet,drawWord,drawScan,drawChat];

  // ---------- layout ----------
  function layout(){
    narrow=W<760;
    docH  = H*(narrow?0.25:0.38);
    docCX = W*(narrow?0.155:0.135);
    var bw=narrow?Math.max(42,W*0.095):Math.max(88,W*0.125),
        bh=H*(narrow?0.26:0.36);
    box={w:bw,h:bh,x:W*(narrow?0.355:0.325),y:(H-bh)/2};
    var brw=W*(narrow?0.40:0.445), brh=H*(narrow?0.74:0.84);
    br={x:W-brw-W*0.012, y:(H-brh)/2, w:brw, h:brh, chrome:Math.max(15,brh*0.062)};
    scale=br.w/DESIGN;
    chU=(br.h-br.chrome)/scale;
    cols=br.w>320?3:2;
  }
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    var r=cv.getBoundingClientRect(); W=r.width; H=r.height;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0); layout();
  }

  // ---------- bakgrund ----------
  function bg(){
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
    var g1=ctx.createRadialGradient(docCX,H*0.5,0,docCX,H*0.5,W*0.26);
    g1.addColorStop(0,'rgba(168,112,66,.050)'); g1.addColorStop(1,'rgba(168,112,66,0)');
    ctx.fillStyle=g1; ctx.fillRect(0,0,W,H);
    var g2=ctx.createRadialGradient(box.x+box.w/2,H*0.5,0,box.x+box.w/2,H*0.5,W*0.20);
    g2.addColorStop(0,'rgba(21,115,90,.075)'); g2.addColorStop(1,'rgba(21,115,90,0)');
    ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
  }

  // ---------- vanster: dokumentens livscykel ----------
  // u 0..1: 0-.20 poppar upp, .20-.74 varden extraheras, .74-1 krymper bort
  function slotState(i,t){
    var raw=t/CYCLE + i/SLOTS;
    var u=raw-Math.floor(raw), lap=Math.floor(raw);
    var idx=((i+lap*SLOTS)%DOC_SET.length+DOC_SET.length)%DOC_SET.length;
    var def=DOCS[DOC_SET[idx]], seed=i*31+lap*7;
    var inn=clamp01(u/0.20), out=clamp01((u-0.74)/0.26);
    var s=lerp(0.52,1,easeOut(inn))*lerp(1,0.46,out*out);
    return {
      def:def, u:u, s:s, seed:seed,
      a:Math.min(clamp01(u/0.10),1-out),
      x:docCX+(hash(seed,1)-0.5)*W*0.030,
      y:H*0.5+(hash(seed,2)-0.5)*H*0.24+Math.sin(t*0.5+i*2)*3,
      rot:(hash(seed,3)-0.5)*0.13*(1-inn*0.6),
      ex:clamp01((u-0.20)/0.10)*(1-clamp01((u-0.70)/0.06)),
      lift:lerp(16,0,easeOut(inn))
    };
  }

  function drawDoc(st){
    if(st.a<=0.012) return;
    var def=st.def, k=(docH*def.fit/def.lh)*st.s;
    ctx.save();
    ctx.globalAlpha=st.a;
    ctx.translate(st.x,st.y+st.lift);
    ctx.rotate(st.rot+def.skew);
    ctx.scale(k,k);
    ctx.translate(-def.lw/2,-def.lh/2);

    ctx.save();
    ctx.shadowColor='rgba(38,32,24,.20)'; ctx.shadowBlur=28/k; ctx.shadowOffsetY=14/k;
    ctx.fillStyle=def.tint; ctx.fillRect(0,0,def.lw,def.lh);
    ctx.restore();
    ctx.fillStyle=def.tint; ctx.fillRect(0,0,def.lw,def.lh);

    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,def.lw,def.lh); ctx.clip();
    PAINT[def.t](ctx,def);
    ctx.restore();
    ctx.strokeStyle=ink(.13); ctx.lineWidth=0.8;
    ctx.strokeRect(0.4,0.4,def.lw-0.8,def.lh-0.8);

    // markerade varden
    if(st.ex>0){
      for(var i=0;i<ANCHORS.length;i++){
        var pop=clamp01((st.ex-i*0.12)/0.22);
        if(pop<=0) continue;
        var fy=def.lh*ANCHORS[i], fh=Math.max(10,def.lh*0.052),
            fx=def.lw*0.10, fw=def.lw*(0.52+0.22*hash(st.seed+i,4));
        var sc=lerp(1.06,1,pop);
        ctx.save();
        ctx.translate(fx+fw/2,fy); ctx.scale(sc,sc);
        rr(ctx,-fw/2,-fh/2,fw,fh,2);
        ctx.fillStyle=g((0.09*pop).toFixed(3)); ctx.fill();
        ctx.strokeStyle=g((0.60*pop).toFixed(3)); ctx.lineWidth=1; ctx.stroke();
        ctx.restore();
      }
    }
    ctx.restore();
  }

  // ---------- pulserande streck: dokument -> box ----------
  function drawExtraction(t,states){
    var bx=box.x, by=box.y;
    for(var s=0;s<states.length;s++){
      var st=states[s];
      if(st.ex<=0.01||st.a<=0.05) continue;
      var def=st.def, k=(docH*def.fit/def.lh)*st.s;
      var x0=st.x+def.lw*k*0.46;
      for(var i=0;i<ANCHORS.length;i++){
        var pop=clamp01((st.ex-i*0.12)/0.22);
        if(pop<=0.02) continue;
        var y0=st.y+st.lift+(ANCHORS[i]-0.5)*def.lh*k;
        var y3=by+box.h*(0.30+0.18*i)+Math.sin(t*0.6+i)*2;
        var x1=lerp(x0,bx,0.42), x2=lerp(x0,bx,0.62);
        ctx.save();
        ctx.setLineDash([2.5,7]); ctx.lineDashOffset=-(t*64+i*5);
        ctx.strokeStyle=g((0.30*pop*st.a).toFixed(3)); ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x0,y0);
        ctx.bezierCurveTo(x1,y0,x2,y3,bx-1,y3); ctx.stroke();
        ctx.restore();
        for(var d=0;d<2;d++){
          var pp=(t*0.42+i*0.31+d*0.5+s*0.17)%1;
          var pt=bez(pp,x0,y0,x1,y0,x2,y3,bx-1,y3);
          var fade=Math.sin(pp*Math.PI);
          ctx.fillStyle=g((0.85*fade*pop*st.a).toFixed(3));
          rr(ctx,pt.x-2.6,pt.y-1.5,5.2,3,1.5); ctx.fill();
        }
      }
    }
  }

  // ---------- mitten: insamlingsboxen ----------
  function drawBox(t){
    ctx.save();
    ctx.shadowColor='rgba(40,34,26,.16)'; ctx.shadowBlur=24; ctx.shadowOffsetY=10;
    rr(ctx,box.x,box.y,box.w,box.h,9); ctx.fillStyle='#FFFFFF'; ctx.fill();
    ctx.restore();
    rr(ctx,box.x+0.5,box.y+0.5,box.w-1,box.h-1,9);
    ctx.strokeStyle=ink(.14); ctx.lineWidth=1; ctx.stroke();

    var pad=Math.max(7,box.w*0.11), x=box.x+pad, w=box.w-pad*2;
    bar(ctx,x,box.y+pad,w*0.52,5,g('.45'));
    var bl=0.5+0.5*Math.sin(t*3.2);
    ctx.beginPath(); ctx.arc(box.x+box.w-pad-2,box.y+pad+2.5,2.8,0,6.2832);
    ctx.fillStyle=g((0.35+0.5*bl).toFixed(3)); ctx.fill();

    var top=box.y+pad+14, bot=box.y+box.h-pad-9, rows=Math.max(4,Math.floor((bot-top)/11));
    var rh=(bot-top)/rows;
    ctx.save();
    rr(ctx,box.x+1,top-3,box.w-2,bot-top+8,6); ctx.clip();
    // en fyllnadsfront vandrar nedat och nollstalls, som en insamling som gors om
    var front=((t*0.20)%1)*(rows+1.5);
    for(var r=0;r<rows;r++){
      var y=top+r*rh, f=clamp01(front-r);
      bar(ctx,x,y,w,4.4,ink(.075));
      if(f>0.01) bar(ctx,x,y,Math.max(0.5,w*(0.32+0.68*f)*f),4.4,g((0.30+0.45*f).toFixed(3)));
    }
    var sy=top+((t*0.35)%1)*(bot-top);
    var lg=ctx.createLinearGradient(0,sy-12,0,sy+3);
    lg.addColorStop(0,g('0')); lg.addColorStop(1,g('.13'));
    ctx.fillStyle=lg; ctx.fillRect(box.x+1,sy-12,box.w-2,15);
    ctx.restore();

    var ry=box.y+box.h-pad, cx=box.x+pad+((t*0.5)%1)*(box.w-pad*2);
    ctx.fillStyle=ink(.10); ctx.fillRect(box.x+pad,ry,box.w-pad*2,1);
    var hg=ctx.createLinearGradient(cx-box.w*0.2,0,cx+box.w*0.2,0);
    hg.addColorStop(0,g('0')); hg.addColorStop(0.5,g('.75')); hg.addColorStop(1,g('0'));
    ctx.fillStyle=hg; ctx.fillRect(cx-box.w*0.2,ry-0.5,box.w*0.4,2);
  }

  // ---------- pulserande nod: box -> e-handelsvy ----------
  function drawNode(t){
    var x0=box.x+box.w, y0=box.y+box.h/2, x3=br.x, y3=br.y+br.h*0.42;
    var x1=lerp(x0,x3,0.45), x2=lerp(x0,x3,0.6);
    ctx.save();
    ctx.setLineDash([2.5,7]); ctx.lineDashOffset=-(t*70);
    ctx.strokeStyle=g('.32'); ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.moveTo(x0+7,y0); ctx.bezierCurveTo(x1,y0,x2,y3,x3-1,y3); ctx.stroke();
    ctx.restore();
    for(var i=0;i<2;i++){
      var pr=(t*0.62+i*0.5)%1;
      ctx.beginPath(); ctx.arc(x0+7,y0,3.5+pr*9,0,6.2832);
      ctx.strokeStyle=g((0.42*(1-pr)).toFixed(3)); ctx.lineWidth=1.2; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x0+7,y0,3.6,0,6.2832); ctx.fillStyle=g('.90'); ctx.fill();
    for(var d=0;d<3;d++){
      var pp=(t*0.34+d/3)%1;
      var pt=bez(pp,x0+7,y0,x1,y0,x2,y3,x3-1,y3), fade=Math.sin(pp*Math.PI);
      ctx.fillStyle=g((0.85*fade).toFixed(3));
      rr(ctx,pt.x-3,pt.y-1.7,6,3.4,1.7); ctx.fill();
    }
    return (t*0.34)%1;
  }

  // ---------- hoger: e-handelsvyn ----------
  function fadeIn(p,thr){ return clamp01((p-thr)/0.10); }
  function flash(p,thr){
    var a=clamp01((p-thr)/0.04), b=1-clamp01((p-thr-0.04)/0.13);
    return a*b*0.8;
  }
  function fld(c,x,y,w,h,p,thr,base){
    var f=fadeIn(p,thr), sk=1-f;
    if(sk>0.01) bar(c,x,y,w,h,ink((0.085*sk).toFixed(3)));
    if(f<=0.01) return;
    var tint=flash(p,thr), rise=(1-f)*3;
    var col=tint>0.02
      ? 'rgba('+Math.round(lerp(28,21,tint))+','+Math.round(lerp(27,115,tint))+','
        +Math.round(lerp(25,90,tint))+','+(base*f).toFixed(3)+')'
      : ink((base*f).toFixed(3));
    bar(c,x,y+rise,w*lerp(0.86,1,f),h,col);
  }

  function drawShop(t,arrive){
    var ch=br.chrome;
    ctx.save();
    ctx.shadowColor='rgba(40,34,26,.20)'; ctx.shadowBlur=30; ctx.shadowOffsetY=12;
    rr(ctx,br.x,br.y,br.w,br.h,10); ctx.fillStyle='#FFFFFF'; ctx.fill();
    ctx.restore();

    ctx.save();
    rr(ctx,br.x,br.y,br.w,br.h,10); ctx.clip();
    ctx.fillStyle='#EFEEEB'; ctx.fillRect(br.x,br.y,br.w,ch);
    for(var i=0;i<3;i++){
      ctx.beginPath(); ctx.arc(br.x+10+i*8,br.y+ch/2,2.2,0,6.2832);
      ctx.fillStyle='#D6D4CF'; ctx.fill();
    }
    rr(ctx,br.x+38,br.y+ch*0.24,br.w-52,ch*0.52,ch*0.26);
    ctx.fillStyle='#FFFFFF'; ctx.fill();
    T(ctx,narrow?'butiken.se':'butiken.se/produkter',br.x+46,br.y+ch*0.70,
      Math.min(7,ch*0.42,(br.w-64)/12),'',ink(.34),'left',MONO);

    var cx=br.x, cy=br.y+ch, cw=br.w, chh=br.h-ch;
    ctx.save();
    ctx.beginPath(); ctx.rect(cx,cy,cw,chh); ctx.clip();
    ctx.translate(cx,cy); ctx.scale(scale,scale);

    var scroll=t*SCROLL;
    var headU=30, pad=16, gap=13;
    var cardW=(DESIGN-pad*2-gap*(cols-1))/cols;
    var imgH=cardW*0.64;
    var cardH=imgH+11+7+10+5+12+9;
    var rowH=cardH+20;

    var first=Math.floor((scroll-headU)/rowH)-1;
    for(var n=first;n<first+Math.ceil(chU/rowH)+3;n++){
      if(n<0) continue;
      var yTop=headU+8+n*rowH-scroll;
      if(yTop>chU+4||yTop+cardH<headU-4) continue;
      for(var c2=0;c2<cols;c2++){
        var p=clamp01(clamp01((chU-yTop)/(chU-headU-6))-c2*0.05);
        var x=pad+c2*(cardW+gap), y=yTop;
        rr(ctx,x,y,cardW,cardH,5);
        ctx.fillStyle='#FFFFFF'; ctx.fill();
        ctx.strokeStyle=ink(.09); ctx.lineWidth=0.7; ctx.stroke();

        rr(ctx,x+7,y+7,cardW-14,imgH,4);
        ctx.fillStyle=ink(.045); ctx.fill();
        var fi=fadeIn(p,0.16);
        if(fi>0.01){
          ctx.save(); rr(ctx,x+7,y+7,cardW-14,imgH,4); ctx.clip();
          var seed=hash(n*3+c2,11);
          var ig=ctx.createLinearGradient(x+7,y+7,x+cardW-7,y+7+imgH);
          ig.addColorStop(0,'rgba('+Math.round(lerp(240,228,seed))+','
            +Math.round(lerp(238,233,seed))+','+Math.round(lerp(233,226,seed))+','+fi.toFixed(3)+')');
          ig.addColorStop(1,'rgba(214,211,203,'+(0.85*fi).toFixed(3)+')');
          ctx.fillStyle=ig; ctx.fillRect(x+7,y+7,cardW-14,imgH);
          ctx.globalAlpha=fi*0.42;
          ctx.fillStyle=ink(.34);
          var sw=(cardW-14)*0.30, sh=imgH*0.46;
          rr(ctx,x+7+((cardW-14)-sw)/2,y+7+(imgH-sh)/2,sw,sh,sw*0.24); ctx.fill();
          ctx.globalAlpha=1;
          ctx.restore();
        }
        var ty=y+imgH+18;
        fld(ctx,x+7,ty,    (cardW-14)*0.82,6.5,p,0.36,0.68);
        fld(ctx,x+7,ty+11, (cardW-14)*0.54,4.5,p,0.52,0.30);
        fld(ctx,x+7,ty+23, (cardW-14)*0.34,8,  p,0.68,0.80);
        var bp=fadeIn(p,0.84);
        if(bp>0.01){
          rr(ctx,x+cardW-7-26,ty+23,26,9,4.5);
          ctx.fillStyle=g((0.16*bp).toFixed(3)); ctx.fill();
        }
      }
    }

    // fast sidhuvud ovanpa
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,DESIGN,headU);
    ctx.beginPath(); ctx.arc(pad+4,headU/2,4,0,6.2832); ctx.fillStyle=g('.85'); ctx.fill();
    bar(ctx,pad+12,headU/2-3.5,38,7,ink(.22));
    for(var nb=0;nb<3;nb++) bar(ctx,pad+66+nb*28,headU/2-2.5,20,5,ink(.12));
    rr(ctx,DESIGN-pad-74,headU/2-6.5,60,13,6.5); ctx.fillStyle=ink(.05); ctx.fill();
    ctx.beginPath(); ctx.arc(DESIGN-pad-4,headU/2,4,0,6.2832); ctx.fillStyle=ink(.18); ctx.fill();
    ctx.strokeStyle=ink(.10); ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(0,headU+0.35); ctx.lineTo(DESIGN,headU+0.35); ctx.stroke();
    var tf=ctx.createLinearGradient(0,headU,0,headU+16);
    tf.addColorStop(0,'rgba(255,255,255,.9)'); tf.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=tf; ctx.fillRect(0,headU,DESIGN,16);
    var bf=ctx.createLinearGradient(0,chU-20,0,chU);
    bf.addColorStop(0,'rgba(255,255,255,0)'); bf.addColorStop(1,'rgba(255,255,255,.92)');
    ctx.fillStyle=bf; ctx.fillRect(0,chU-20,DESIGN,20);
    ctx.restore();

    var pulse=Math.pow(Math.sin(arrive*Math.PI),6);
    if(pulse>0.01){
      var eg=ctx.createLinearGradient(br.x,0,br.x+br.w*0.16,0);
      eg.addColorStop(0,g((0.16*pulse).toFixed(3))); eg.addColorStop(1,g('0'));
      ctx.fillStyle=eg; ctx.fillRect(br.x,br.y+ch,br.w*0.16,br.h-ch);
    }
    ctx.restore();

    rr(ctx,br.x+0.5,br.y+0.5,br.w-1,br.h-1,10);
    ctx.strokeStyle=ink(.13); ctx.lineWidth=1; ctx.stroke();
  }

  // ---------- loop ----------
  function frame(now){
    var t=reduce?9.2:now/1000+9.2;
    bg();
    var states=[];
    for(var i=0;i<SLOTS;i++) states.push(slotState(i,t));
    drawExtraction(t,states);
    states.slice().sort(function(a,b){return a.s-b.s;}).forEach(drawDoc);
    drawBox(t);
    var arrive=drawNode(t);
    drawShop(t,arrive);
    if(!reduce) requestAnimationFrame(frame);
  }

  addEventListener('resize',resize);
  resize();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(resize);
  requestAnimationFrame(frame);
})();
</script>
