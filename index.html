    rr(c,10,32,26,6,3); c.fillStyle='rgba(28,27,25,.30)'; c.fill();
    var nav=['Översikt','Order','Leveranser','Fakturor','Inställningar'];
    for(var n=0;n<nav.length;n++){
      if(n===1){ rr(c,6,50+n*15-9,46,13,3); c.fillStyle='rgba(21,115,90,.10)'; c.fill(); }
      T(c,nav[n],12,50+n*15,5.6,n===1?'600':'',n===1?'rgba(21,115,90,.95)':'rgba(28,27,25,.55)');
    }

    T(c,'Order',70,40,6,'',FAINT);
    T(c,'24-1187',118,46,13,'600',INK,'left',MONO);
    rr(c,196,36,34,13,6.5); c.fillStyle='rgba(21,115,90,.12)'; c.fill();
    T(c,'Ny',213,45,5.6,'600','rgba(21,115,90,.95)','center');
    rr(c,lw-70,34,58,17,4); c.fillStyle='#23221F'; c.fill();
    T(c,'Bekräfta',lw-41,45,5.8,'500','#fff','center');

    rule(c,70,62,lw-12);
    var hd=['Artnr','Benämning','Antal','Belopp'], hx=[70,120,240,lw-12];
    for(var h=0;h<4;h++) T(c,hd[h],hx[h],72,5.4,'600','rgba(28,27,25,.55)',h>1?'right':'left');
    rule(c,70,76,lw-12,'rgba(28,27,25,.16)');
    for(var r=0;r<5;r++){
      var y=88+r*15;
      T(c,CONF[r][0],70,y,5.8,'',SOFT,'left',MONO);
      T(c,CONF[r][1],120,y,5.8,'','rgba(28,27,25,.78)');
      T(c,CONF[r][2],240,y,5.8,'500','rgba(28,27,25,.85)','right',MONO);
      T(c,CONF[r][3],lw-12,y,5.8,'',SOFT,'right',MONO);
      rule(c,70,y+4,lw-12,'rgba(28,27,25,.07)');
    }
    T(c,'Summa',236,178,5.6,'',FAINT,'right');
    T(c,'20 090,00',lw-12,178,6.6,'600',INK,'right',MONO);
  }

  var PAINT=[drawMail,drawSheet,drawConfirm,drawNote,drawChat,drawPortal];

  // ---------- scen ----------
  function layout(){
    var narrow=W<760;
    cols=narrow?7:10; visible=narrow?5:7;
    readX=W*0.365;
    panel={x:W*0.552,y:H*0.14,w:W*0.408,h:H*0.72};
    pw=panel.w; ph=panel.h;
    pad=Math.max(12,pw*0.055); headerH=26;
    LH=(ph-pad*2-headerH)/visible;
    cTop=pad+headerH; cBot=ph-pad; wY=cBot-LH*0.62;
    lblX=pad; lblW=pw*0.155;
    var sx=lblX+lblW+14, sw=(pw-pad)-sx, unit=sw/(cols+1.4);
    fs=Math.min(unit*1.06,LH*0.52,15);
    sX=[]; var x=sx+unit*0.5;
    for(var c=0;c<cols;c++){ if(c===3||c===6) x+=unit*0.7; sX.push(x); x+=unit; }
    SS=DPR; off.width=Math.round(pw*SS); off.height=Math.round(ph*SS);
  }
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    var r=cv.getBoundingClientRect(); W=r.width; H=r.height;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0); layout();
  }

  function bg(){
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
    var g=ctx.createRadialGradient(W*0.16,H*0.5,0,W*0.16,H*0.5,W*0.32);
    g.addColorStop(0,'rgba(168,112,66,.045)'); g.addColorStop(1,'rgba(168,112,66,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    var g2=ctx.createRadialGradient(readX,H*0.5,0,readX,H*0.5,W*0.22);
    g2.addColorStop(0,'rgba(21,115,90,.075)'); g2.addColorStop(1,'rgba(21,115,90,0)');
    ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
  }

  function slotState(i,t){
    var raw=t*SPEED + i/SLOTS;
    var u=raw-Math.floor(raw);
    var lap=Math.floor(raw);
    var def=DOCS[DOC_SET[((i+lap*SLOTS)%DOC_SET.length+DOC_SET.length)%DOC_SET.length]];
    var seed=i*31+lap*7;
    var x0=-W*0.12, xE=x0+(readX-x0)/UP;
    return {
      def:def, u:u,
      s:0.74+0.34*u,
      a:Math.min(clamp01(u/0.09), 1-clamp01((u-UP)/0.10)),
      x:lerp(x0,xE,u),
      y:H*0.5+(hash(seed,2)-0.5)*H*0.10*(1-u*0.7)+Math.sin(t*0.4+i)*2.5,
      rot:(hash(seed,3)-0.5)*0.30*clamp01(1-u/UP),
      scan:clamp01((u-0.34)/(UP-0.34))
    };
  }

  function drawDoc(st){
    if(st.a<=0.012) return;
    var def=st.def;
    var base=(def.lw>def.lh) ? H*0.42 : H*0.62;
    var k=(base/def.lh)*st.s;
    var align=clamp01(st.u/UP);

    ctx.save();
    ctx.globalAlpha=st.a;
    ctx.translate(st.x,st.y);
    ctx.rotate(st.rot + def.skew*(1-align));
    ctx.transform(0.90+0.10*align, 0.06*(1-align), 0, 1, 0, 0);
    ctx.scale(k,k);
    ctx.translate(-def.lw/2,-def.lh/2);

    ctx.save();
    ctx.shadowColor='rgba(38,32,24,.18)'; ctx.shadowBlur=26/k; ctx.shadowOffsetY=14/k;
    ctx.fillStyle=def.tint; ctx.fillRect(0,0,def.lw,def.lh);
    ctx.restore();
    ctx.save();
    ctx.shadowColor='rgba(38,32,24,.16)'; ctx.shadowBlur=4/k; ctx.shadowOffsetY=2/k;
    ctx.fillStyle=def.tint; ctx.fillRect(0,0,def.lw,def.lh);
    ctx.restore();

    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,def.lw,def.lh); ctx.clip();
    PAINT[def.type](ctx,def);
    ctx.restore();

    ctx.strokeStyle='rgba(28,27,25,.14)'; ctx.lineWidth=0.7;
    ctx.strokeRect(0.35,0.35,def.lw-0.7,def.lh-0.7);

    var fl=fieldsOf(def);
    for(var i=0;i<fl.length;i++){
      var f=fl[i], pop=clamp01((st.scan-(f.y+f.h)/def.lh)/0.07);
      if(pop<=0) continue;
      var g=lerp(1.07,1,pop);
      ctx.save();
      ctx.translate(f.x+f.w/2,f.y+f.h/2); ctx.scale(g,g);
      rr(ctx,-f.w/2,-f.h/2,f.w,f.h,1.6);
      ctx.fillStyle='rgba(21,115,90,'+(0.055*pop).toFixed(3)+')'; ctx.fill();
      ctx.strokeStyle='rgba(21,115,90,'+(0.62*pop).toFixed(3)+')'; ctx.lineWidth=0.7; ctx.stroke();
      ctx.beginPath(); ctx.arc(-f.w/2,-f.h/2,1.5,0,6.2832);
      ctx.fillStyle='rgba(21,115,90,'+(0.8*pop).toFixed(3)+')'; ctx.fill();
      ctx.restore();
    }

    if(st.scan>0 && st.scan<1){
      var sy=st.scan*def.lh;
      var lg=ctx.createLinearGradient(0,sy-13,0,sy+5);
      lg.addColorStop(0,'rgba(21,115,90,0)'); lg.addColorStop(1,'rgba(21,115,90,.16)');
      ctx.fillStyle=lg; ctx.fillRect(0,sy-13,def.lw,18);
      ctx.fillStyle='rgba(21,115,90,.85)'; ctx.fillRect(0,sy-0.5,def.lw,1);
    }
    ctx.restore();
  }

  function drawFeed(t,quad){
    ctx.save(); ctx.setLineDash([2.5,8]); ctx.lineWidth=1;
    for(var u=0;u<4;u++){
      var sy=lerp(H*0.34,H*0.66,(u+0.5)/4);
      var ty=lerp(quad.cy-quad.hL*0.55,quad.cy+quad.hL*0.6,(u+0.5)/4);
      ctx.lineDashOffset=-(t*78+u*6);
      ctx.strokeStyle='rgba(21,115,90,.30)';
      ctx.beginPath(); ctx.moveTo(readX+8,sy);
      ctx.bezierCurveTo(readX+W*0.06,sy,quad.xL-W*0.05,ty,quad.xL-2,ty);
      ctx.stroke();
    }
    ctx.restore();
  }

  function renderPanel(t,dtSlot){
    oc.setTransform(SS,0,0,SS,0,0); oc.clearRect(0,0,pw,ph);
    rr(oc,0.5,0.5,pw-1,ph-1,9); oc.fillStyle='#fff'; oc.fill();
    oc.strokeStyle='rgba(28,27,25,.14)'; oc.lineWidth=1; oc.stroke();
    oc.fillStyle='rgba(21,115,90,.40)'; rr(oc,pad,pad-1,pw*0.19,6,3); oc.fill();
    oc.fillStyle='rgba(28,27,25,.13)'; rr(oc,pad+pw*0.23,pad-1,pw*0.13,6,3); oc.fill();
    var bl=0.5+0.5*Math.sin(t*3.4);
    oc.beginPath(); oc.arc(pw-pad-4,pad+2,3.2,0,6.2832);
    oc.fillStyle='rgba(21,115,90,'+(0.4+0.5*bl).toFixed(3)+')'; oc.fill();

    oc.save(); rr(oc,1,cTop-2,pw-2,cBot-cTop+4,6); oc.clip();
    var u=t*LPS, kNow=Math.floor(u);
    oc.textAlign='center'; oc.textBaseline='middle';
    for(var k=kNow;k>=kNow-visible-1;k--){
      var y=wY-(u-k)*LH;
      if(y<cTop-LH||y>cBot+LH) continue;
      var a=clamp01((y-cTop)/(LH*1.6));
      var filled=clamp01((t-k/LPS)*LPS);
      oc.fillStyle='rgba(28,27,25,'+(0.11*a).toFixed(3)+')';
      rr(oc,lblX,y-3.2,lblW,6.4,3.2); oc.fill();
      oc.fillStyle='rgba(21,115,90,'+((0.20+0.55*filled)*a).toFixed(3)+')';
      rr(oc,lblX,y-3.2,Math.max(0.001,lblW*Math.min(1,filled*1.1)),6.4,3.2); oc.fill();
      oc.font=fs.toFixed(1)+'px '+MONO;
      for(var c=0;c<cols;c++){
        var n=k*cols+c, arr=n*dtSlot;
        if(arr>t) continue;
        var fr=clamp01((t-arr)/0.5);
        oc.fillStyle='rgba('+(lerp(OUT_R,INK_R,fr)|0)+','+(lerp(OUT_G,INK_G,fr)|0)+','
                    +(lerp(OUT_B,INK_B,fr)|0)+','+(0.9*a).toFixed(3)+')';
        oc.fillText(OUT.charAt(Math.floor(hash(n,9)*OUT.length)),sX[c],y);
      }
    }
    var nCur=Math.floor(t/dtSlot), cc=nCur-Math.floor(nCur/cols)*cols;
    var cx=sX[cc]+(sX[1]-sX[0])*0.5, cy=wY-(u-Math.floor(nCur/cols))*LH;
    oc.fillStyle='rgba(21,115,90,'+(0.35+0.5*Math.abs(Math.sin(t*8))).toFixed(3)+')';
    oc.fillRect(cx-0.9,cy-fs*0.55,1.8,fs*1.1);
    var railY=cBot-1, rx0=sX[0]-(sX[1]-sX[0])*0.6, rx1=sX[cols-1]+(sX[1]-sX[0])*0.6;
    oc.fillStyle='rgba(28,27,25,.10)'; oc.fillRect(rx0,railY,rx1-rx0,1);
    var hg=oc.createLinearGradient(cx-34,0,cx+34,0);
    hg.addColorStop(0,'rgba(21,115,90,0)'); hg.addColorStop(.5,'rgba(21,115,90,.78)');
    hg.addColorStop(1,'rgba(21,115,90,0)');
    oc.fillStyle=hg; oc.fillRect(cx-34,railY-0.5,68,2);
    var fg=oc.createLinearGradient(0,cTop-2,0,cTop+LH*1.8);
    fg.addColorStop(0,'rgba(255,255,255,1)'); fg.addColorStop(1,'rgba(255,255,255,0)');
    oc.fillStyle=fg; oc.fillRect(0,cTop-2,pw,LH*1.8);
    oc.restore();
  }

  function panelQuad(t){
    var zL=-0.30+0.05*Math.sin(t*0.15), zR=0.20+0.05*Math.sin(t*0.15);
    var sL=FOV/(FOV-zL), sR=FOV/(FOV-zR), norm=2/(sL+sR);
    return {xL:panel.x,xR:panel.x+pw,cy:panel.y+ph/2+3*Math.sin(t*0.22),
            hL:(ph/2)*sL*norm,hR:(ph/2)*sR*norm,sL:sL,sR:sR};
  }
  function blitPanel(q){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(q.xL,q.cy-q.hL); ctx.lineTo(q.xR,q.cy-q.hR);
    ctx.lineTo(q.xR,q.cy+q.hR); ctx.lineTo(q.xL,q.cy+q.hL); ctx.closePath();
    ctx.shadowColor='rgba(40,34,26,.20)'; ctx.shadowBlur=30; ctx.shadowOffsetY=12;
    ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();
    var destW=q.xR-q.xL, STEP=3;
    for(var px=0;px<destW;px+=STEP){
      var p0=px/destW, p1=Math.min(1,(px+STEP)/destW);
      var u0=(p0*q.sR)/((1-p0)*q.sL+p0*q.sR);
      var u1=(p1*q.sR)/((1-p1)*q.sL+p1*q.sR);
      var hh=lerp(q.hL,q.hR,(u0+u1)/2);
      var sx0=u0*off.width, sx1=u1*off.width;
      if(sx1-sx0<0.1) continue;
      ctx.drawImage(off,sx0,0,sx1-sx0,off.height,q.xL+px,q.cy-hh,(p1-p0)*destW+0.6,hh*2);
    }
  }

  function frame(now){
    var t=(reduce?18:now/1000+18), dtSlot=1/(LPS*cols);
    var q=panelQuad(t);
    bg();
    drawFeed(t,q);
    var list=[];
    for(var i=0;i<SLOTS;i++) list.push(slotState(i,t));
    list.sort(function(a,b){return a.s-b.s;}).forEach(drawDoc);
    renderPanel(t,dtSlot);
    blitPanel(q);
    if(!reduce) requestAnimationFrame(frame);
  }

  addEventListener('resize',resize);
  resize();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(resize);
  requestAnimationFrame(frame);
})();
</script>
